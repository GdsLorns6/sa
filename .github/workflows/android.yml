name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK platform
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" || true

      - name: Detect Gradle version
        id: gv
        run: |
          V=$(grep distributionUrl gradle/wrapper/gradle-wrapper.properties 2>/dev/null | sed -E 's/.*gradle-([0-9.]+)-(bin|all)\.zip.*/\1/')
          echo "version=${V:-8.11.1}" >> "$GITHUB_OUTPUT"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gv.outputs.version }}

      - name: Build debug APK
        run: gradle assembleDebug --console=plain 2>&1 | tee build.log

      - name: Show errors
        if: failure()
        run: grep -E -B2 -A12 "^e: |What went wrong|Could not|FAILED" build.log | head -80

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish to Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$APK" --title "Latest build" --notes "Build ${{ github.sha }}" --prerelease
