name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK platforms
        shell: bash
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" || true

      - name: Detect Gradle version
        id: gv
        shell: bash
        run: |
          V=$(grep distributionUrl gradle/wrapper/gradle-wrapper.properties 2>/dev/null | sed -E 's/.*gradle-([0-9.]+)-(bin|all)\.zip.*/\1/')
          echo "version=${V:-8.11.1}" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gv.outputs.version }}

      - name: Build debug APK
        shell: bash
        run: |
          gradle assembleDebug --console=plain 2>&1 | tee build.log

      - name: Show key errors
        if: failure()
        shell: bash
        run: |
          echo "===== KEY ERROR LINES ====="
          grep -n -E "^Execution failed|^A problem occurred|^e: |Dependency '|compileSdk|minCompileSdk|Duplicate class|Could not resolve|Unresolved reference|^> " build.log | cut -c1-260 | head -15

      - name: Save full log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish to Releases
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$APK" --title "Latest build" --notes "Build ${{ github.sha }}" --prerelease
